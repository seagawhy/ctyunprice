    <style>
/* 天翼云报价工具 - 新中式国风设计 */
:root {
    --primary: #c41e3a;
    --primary-dark: #8b1538;
    --secondary: #2c2c2c;
    --accent: #d4af37;
    --bg-primary: #faf8f5;
    --bg-secondary: #fff;
    --bg-card: #ffffff;
    --text-primary: #2c2c2c;
    --text-secondary: #666;
    --border: #e0dcd4;
    --shadow: rgba(0,0,0,0.08);
    --success: #52c41a;
    --warning: #faad14;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei","PingFang SC",-apple-system,sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
.header { background: linear-gradient(135deg,#c41e3a 0%,#8b1538 100%) !important; color: #fff !important; padding: 20px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
.header-content { max-width: 1600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
.header h1 { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
.header h1::before { content: "☁"; font-size: 28px; }
.header-info { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.header-field { display: flex; align-items: center; gap: 8px; }
.header-field label { font-size: 14px; opacity: 0.9; }
.header-field input { padding: 8px 12px; border: none; border-radius: 6px; font-size: 14px; background: rgba(255,255,255,0.95); color: var(--text-primary); min-width: 180px; }
.header-field input:focus { outline: 2px solid var(--accent); }
.main-container { max-width: 1600px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 220px 1fr 500px; gap: 24px; min-height: calc(100vh - 100px); }
.category-nav { background: var(--bg-card); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow); padding: 16px; height: fit-content; position: sticky; top: 100px; }
.category-nav h3 { font-size: 16px; color: var(--text-secondary); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
.category-item { padding: 12px 16px; margin: 6px 0; border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; font-size: 14px; border: 1px solid transparent; }
.category-item:hover { background: #fdf6f0; border-color: var(--accent); }
.category-item.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.category-item .icon { font-size: 18px; }
.category-item .count { margin-left: auto; background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.category-item.active .count { background: rgba(255,255,255,0.2); }
.product-panel { background: var(--bg-card); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow); padding: 20px; }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.panel-header h2 { font-size: 18px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.product-form { background: #fdfcfa; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
.form-row { display: grid; grid-template-columns: 1fr 1fr 100px auto; gap: 12px; margin-bottom: 16px; align-items: stretch; }
.form-group { display: flex; flex-direction: column; gap: 6px; min-height: fit-content; }
.form-group.has-total { min-height: 80px; }
.form-group label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
.form-group select,.form-group input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; transition: border-color 0.3s; }
.form-group select:focus,.form-group input:focus { outline: none; border-color: var(--primary); }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: #f5f5f5; }
.btn-export { background: linear-gradient(135deg,#52c41a 0%,#389e0d 100%) !important; color: #fff !important; font-size: 15px; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: all 0.3s; text-decoration: none !important; }
.btn-export:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(82,196,26,0.3) !important; }
.btn-export:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(82,196,26,0.3); }
.price-reference { background: linear-gradient(135deg,#fff9f0 0%,#fff5eb 100%); border-radius: 10px; padding: 16px; margin-top: 16px; border: 1px solid var(--accent); }
.price-reference h4 { font-size: 13px; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.price-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.price-item { text-align: center; padding: 10px; background: #fff; border-radius: 8px; border: 1px solid #f0e6d8; }
.price-item .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.price-item .value { font-size: 14px; font-weight: 600; color: var(--primary); }
.price-item .unit { font-size: 11px; color: var(--text-secondary); }
.quote-panel { background: var(--bg-card); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow); display: flex; flex-direction: column; height: fit-content; position: sticky; top: 100px; max-height: calc(100vh - 140px); }
.quote-header { padding: 16px 20px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.quote-header h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.quote-actions { display: flex; gap: 8px; }
.btn-clear { background: #fff1f0; color: var(--primary); border: 1px solid #ffccc7; padding: 6px 12px; font-size: 12px; }
.btn-clear:hover { background: #fff1f0; }
.quote-table-wrapper { flex: 1; overflow-y: auto; padding: 0 16px; }
.quote-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.quote-table th { background: #faf8f5; padding: 10px 8px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); position: sticky; top: 0; font-size: 11px; }
.quote-table td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
.quote-table tr:hover { background: #fdf9f7; }
.quote-table .product-name { font-weight: 500; color: var(--text-primary); }
.quote-table .spec { font-size: 10px; color: var(--text-secondary); }
.quote-table .price-cell { text-align: right; font-variant-numeric: tabular-nums; }
.quote-table .qty-cell { text-align: center; }
.quote-table .qty-input { width: 50px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 12px; }
.quote-table .qty-input:focus { outline: none; border-color: var(--primary); }
.quote-table .discount-cell { text-align: center; }
.quote-table .discount-input { width: 52px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; text-align: center; font-size: 12px; background: #fffbe6; }
.quote-table .discount-input:focus { outline: none; border-color: #faad14; }
.summary-value.highlight { color: #cf1322; font-weight: 700; }
.btn-delete { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.2s; }
.btn-delete:hover { background: #fff1f0; color: var(--primary); }
.quote-summary { padding: 16px 20px; background: linear-gradient(135deg,#fff9f0 0%,#fff5eb 100%); border-top: 2px solid var(--accent); border-radius: 0 0 12px 12px; }
.summary-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.summary-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border-radius: 6px; border: 1px solid #f0e6d8; }
.summary-item.total { grid-column: 1 / -1; background: var(--primary); color: #fff; border: none; }
.summary-label { font-size: 12px; color: var(--text-secondary); }
.summary-item.total .summary-label { color: rgba(255,255,255,0.9); }
.summary-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.export-btn-wrapper { display: flex; justify-content: center; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; }
@media(max-width:1200px){.main-container{grid-template-columns:200px 1fr 420px}}
@media(max-width:1024px){.main-container{grid-template-columns:1fr;gap:16px}.category-nav{display:flex;flex-wrap:wrap;gap:8px;position:static;order:1}.category-nav h3{width:100%;margin-bottom:8px}.category-item{flex:1;min-width:100px;justify-content:center;padding:10px 12px}.product-panel{order:2}.quote-panel{order:3;position:static;max-height:none}.form-row{grid-template-columns:1fr 1fr}}

.qr-code-wrapper{text-align:center;padding:12px;background:#fafafa;border-radius:10px;border:2px dashed #e0ddd5}
.qr-code-wrapper img{width:160px;height:160px;object-fit:contain;border-radius:8px;background:#f5f5f5}
.qr-hint{font-size:11px!important;color:var(--text-secondary)!important;margin-top:8px!important;margin-bottom:0!important}
.license-divider{height:1px;background:linear-gradient(90deg,transparent,#e0dcd4,transparent);margin:22px 0}
.input-group{display:flex;gap:8px;margin-top:4px}
.input-group input{flex:1;padding:11px 14px;border:2px solid #e0ddd5;border-radius:8px;font-size:15px;outline:none;transition:border-color .25s;letter-spacing:2px;font-weight:600;text-transform:uppercase}
.input-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(196,30,58,.1)}
.btn-license-submit{padding:11px 18px;background:linear-gradient(135deg,var(primary) 0%,var(primary-dark) 100%);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .25s}
.btn-license-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 15px rgba(196,30,58,.35)}
.btn-license-submit:disabled{opacity:.7;cursor:not-allowed}
.license-error{color:var(--primary);font-size:12px!important;margin-top:8px!important;min-height:17px}
.license-footer{padding:14px 24px;border-top:1px solid #f0e8e0;text-align:center;background:#fdfcfa;border-radius:0 0 16px 16px}
.license-note{font-size:12px;color:var(--text-secondary);margin:0}
@media(max-width:520px){.license-dialog{width:95%;max-height:95vh;border-radius:12px}.license-dialog .license-header{border-radius:12px 12px 0 0;padding:14px 18px}.license-body{padding:18px}.qr-code-wrapper img{width:140px;height:140px}.input-group{flex-direction:column}.btn-license-submit{width:100%}}
    </style>
    <!-- ExcelJS for Excel Export -->
    <script src="js/exceljs.min.js?v=3"></script>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="header">
        <div class="header-content">
            <h1>天翼云报价工具</h1>
            <div class="header-info">
                <div class="header-field">
                    <label>项目名称：</label>
                    <input type="text" id="projectName" placeholder="请输入项目名称">
                </div>
                <div class="header-field">
                    <label>报价日期：</label>
                    <input type="text" id="quoteDate" readonly>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-container">
        <!-- 左侧分类导航 -->
        <nav class="category-nav" id="categoryNav">
            <h3>产品分类</h3>
            <!-- 动态渲染 -->
        </nav>

        <!-- 中间产品选择区 -->
        <section class="product-panel">
            <div class="panel-header">
                <h2 id="currentCategoryTitle">🖥️ 计算资源</h2>
            </div>
            
            <!-- 产品列表区域 -->
            <div class="product-list" id="productList">
                <!-- 动态渲染 -->
            </div>
        </section>

        <!-- 右侧报价清单 -->
        <aside class="quote-panel">
            <div class="quote-header">
                <h2>📋 报价清单</h2>
                <div class="quote-actions">
                    <button class="btn btn-clear" id="clearBtn">🗑️ 清空</button>
                </div>
            </div>

            <!-- 报价表格 -->
            <div class="quote-table-wrapper">
                <table class="quote-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>产品名称</th>
                            <th>规格配置</th>
                            <th>数量</th>
                            <th>月租单价</th>
                            <th>年租单价</th>
                            <th>三年单价</th>
                            <th>折扣</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="quoteTableBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 合计栏 -->
            <div class="quote-summary">
                <div id="summaryContent">
                    <!-- 动态渲染 -->
                </div>
                <div class="export-btn-wrapper">
                    <button class="btn btn-export" id="exportBtn">
                        📥 导出 Excel 报价单
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- 统一验证接口：本地API优先，CloudBase备用（兼容双部署模式） -->
    <script>
        // 注册码统一验证函数
        window.callCloudFunction = async function(name, data) {
            if (name === 'verifyLicense' && data.action === 'verify') {
                return await localVerifyLicense(data.code);
            }
            return { success: false, message: '不支持的操作' };
        };

        // 本地API验证注册码
        async function localVerifyLicense(code) {
            try {
                const res = await fetch('/api/verify-license', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                return await res.json();
            } catch(e) {
                console.warn('Local API failed, fallback to CloudBase:', e);
                return await cloudBaseVerify(code);
            }
        }

        // CloudBase 云函数备用验证
        async function cloudBaseVerify(code) {
            const envId = 'ctyunprice-1gskqexee5ae249e';
            let ticket = null;
            try {
                const authRes = await fetch(`https://${envId}.tcloudbaseapp.com/tcb/auth?env=${envId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'anonymousLogin' })
                });
                const authData = await authRes.json();
                if (authData.data && authData.data.ticket) ticket = authData.data.ticket;
            } catch(e) {}

            const body = { action: 'verify', code };
            if (ticket) body.ticket = ticket;

            const res = await fetch(
                `https://${envId}.tcloudbaseapp.com/tcb/invokefunction?name=verifyLicense&env=${envId}&ticket=${ticket || ''}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(body)
                }
            );
            const result = await res.json();

            if (result.code === 0 && result.response_data) return JSON.parse(result.response_data);
            if (result.result) return result.result;
            if (result.success !== undefined) return result;

            throw new Error(result.message || '云函数调用失败');
        }
    </script>
